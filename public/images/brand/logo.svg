<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#C69A32"/>
      <stop offset="100%" stop-color="#A67C1A"/>
    </linearGradient>
    <pattern id="ankara" patternUnits="userSpaceOnUse" width="20" height="20">
      <circle cx="10" cy="10" r="3" fill="#C69A32" opacity="0.5"/>
      <circle cx="0" cy="0" r="2" fill="#C69A32" opacity="0.3"/>
      <circle cx="20" cy="20" r="2" fill="#C69A32" opacity="0.3"/>
    </pattern>
  </defs>
  <!-- H letter navy -->
  <text x="200" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="160" font-weight="700" fill="#071D38" text-anchor="middle">H</text>
  <!-- A letter gold with triangle peak -->
  <text x="380" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="160" font-weight="700" fill="#C69A32" text-anchor="middle">A</text>
  <!-- Fabric piece left -->
  <g transform="translate(40,40) rotate(-25)">
    <path d="M0,20 L80,0 L90,100 L10,120 Z" fill="#071D38"/>
    <path d="M10,30 L70,15 L78,90 L18,105 Z" fill="url(#ankara)"/>
    <path d="M0,20 L80,0 L90,100 L10,120 Z" fill="none" stroke="#C69A32" stroke-width="3"/>
  </g>
  <!-- Thread waves -->
  <path d="M250,100 Q320,60 400,90 T550,80" fill="none" stroke="#C69A32" stroke-width="8" stroke-linecap="round"/>
  <path d="M260,115 Q330,75 410,105 T560,95" fill="none" stroke="#071D38" stroke-width="5" stroke-linecap="round"/>
  <path d="M270,130 Q340,90 420,120 T570,110" fill="none" stroke="#C69A32" stroke-width="4" stroke-linecap="round"/>
  <!-- Spool -->
  <g transform="translate(580,70)">
    <rect x="0" y="20" width="50" height="60" rx="4" fill="#071D38"/>
    <ellipse cx="25" cy="20" rx="25" ry="10" fill="#0a2a4f"/>
    <ellipse cx="25" cy="80" rx="25" ry="10" fill="#071D38"/>
    <path d="M5,25 Q25,40 45,25 M5,40 Q25,55 45,40 M5,55 Q25,70 45,55" fill="none" stroke="#C69A32" stroke-width="2"/>
  </g>
  <!-- Business name -->
  <text x="400" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#071D38" text-anchor="middle" letter-spacing="4">HAFSAT AHMED ALA</text>
  <!-- Divider lines -->
  <line x1="120" y1="290" x2="220" y2="290" stroke="#C69A32" stroke-width="2"/>
  <text x="400" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="600" fill="#C69A32" text-anchor="middle" letter-spacing="6">TEXTILE VENTURES</text>
  <line x1="580" y1="290" x2="680" y2="290" stroke="#C69A32" stroke-width="2"/>
  <!-- Tagline -->
  <text x="400" y="350" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic" fill="#071D38" text-anchor="middle">Quality Fabrics  ·  Elegant Style  ·  Endless Possibilities</text>
</svg>
